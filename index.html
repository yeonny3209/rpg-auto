<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>잔불의 대지 — Emberlands</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Ccircle cx=%278%27 cy=%278%27 r=%276%27 fill=%27%23ffb347%27/%3E%3C/svg%3E" />

    <div id="app"></div>

      <div id="target"><div class="ring"></div><div id="targetName"></div></div>
      <div id="help">WASD 이동 · 좌클릭/J 공격 · 우클릭/K 길게 강공격 · Space 회피 · Tab 고정 · C 능력치 · Q/E·휠클릭 드래그 카메라 · 봉화 곁에서 회복</div>
    </div>
    <div id="floaters"></div>
